#:schema ../../docs/prebench.schema.json
# Écran OLED SSD1306 128 × 64 en I2C1 (D15 = PB8 SCL, D14 = PB9 SDA), adresse 0x3C.
# Le firmware affiche « Prebench », le temps écoulé et une barre qui avance,
# une image entière toutes les 100 ms. Rien ne s'affiche tant que l'écran n'est
# pas alimenté (VCC et GND câblés) : le firmware attend sa réponse.

format_version = 1
board          = "nucleo-f401re"
framework      = "stm32-hal"

[build]
system = "cmake"

[[components]]
id = "oled1"
type = "ssd1306"
pos = [408, 72]
params = { address = 60, size = "128x64", color = "white" }

[[wires]]
from = "oled1.GND"
to = "board.CN6:6"

[[wires]]
from = "oled1.VCC"
to = "board.CN6:4"

[[wires]]
from = "oled1.SCL"
to = "board.CN5:10"

[[wires]]
from = "oled1.SDA"
to = "board.CN5:9"
