[package]
name = "prebench"
version = "0.2.3"
description = "Prebench — simulateur de cartes de développement"
authors = ["Mathis Rudkiewicz"]
license = "MIT"
edition = "2021"
rust-version = "1.95"

[lib]
name = "prebench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Coquille de l'app (D6)
tauri = { version = "2", features = [] }
# Socket Unix / named pipe (section 6.1)
interprocess = { version = "2", features = ["tokio"] }
# Événementiel : E/S asynchrones, processus, minuteurs (règle 16.2.9)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
# Fichiers de carte et de projet (TOML) ; JSON uniquement vers l'interface, hors chemin critique
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Écriture de prebench.toml sans perdre commentaires ni mise en forme (paillasse
# éditée dans l'app) ; déjà présente dans l'arbre de dépendances de toml.
toml_edit = "0.22"
# Erreurs typées (section 16.3)
thiserror = "2"
rquickjs = { version = "0.14.0", features = ["loader"] }
oxc = { version = "0.158", features = ["transformer", "codegen", "semantic"] }
tauri-plugin-updater = "2.14.1"
# Chemins Windows sans le préfixe \\?\ (renvoyé par le dossier des ressources),
# que make et CMake ne savent pas lire ; déjà présente dans l'arbre de Tauri.
dunce = "1.0.5"
# Surveillance du dossier du projet (section 10.2) : FSEvents (macOS),
# ReadDirectoryChangesW (Windows), inotify (Linux). Purement événementielle
# (règle 16.2.9) ; l'anti-rebond est fait au minuteur tokio (session.rs).
notify = "8.2"
# Fenêtre native « Enregistrer sous » (export série, section 10.4), ouverte
# par le cœur seulement : NSSavePanel et IFileSaveDialog sans code Objective-C
# ni COM à maintenir. Plugin officiel de Tauri.
tauri-plugin-dialog = "2.8.4"

# Garde-fous du firmware sous macOS et Linux (platform/macos.rs, section 11.2) :
# setrlimit, proc_pid_rusage, SIGSTOP / SIGCONT ; déjà présente dans l'arbre de Tauri.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Priorité basse, EcoQoS, Job Object (plafond mémoire, kill on close), mesure
# CPU / mémoire et suspension du firmware (platform/windows.rs, section 11.2) ;
# déjà présente dans l'arbre de dépendances de Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    # QueryThreadCycleTime : budget des modèles en temps CPU (platform/windows.rs).
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
# Runtime simulé de Tauri : teste l'acteur et le vrai firmware sans fenêtre.
tauri = { version = "2", features = ["test"] }
