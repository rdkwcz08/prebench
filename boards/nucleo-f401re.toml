#:schema ./board.schema.json
# boards/nucleo-f401re.toml — Carte Nucleo-F401RE (STM32F401RE, Nucleo-64)
# Source du brochage : manuel ST UM1724 (cartes Nucleo-64), configuration
# d'usine des ponts de soudure. Format : boards/board.schema.json.

format_version = 1
name          = "Nucleo-F401RE"
mcu           = "STM32F401RE"
family        = "stm32"
framework     = ["stm32-hal", "arduino"]
logic_voltage = 3.3
adc_bits      = 12
ram_kb        = 96
flash_kb      = 512
image         = "nucleo-64.svg"
reset         = "B2"

[power]
"3V3" = 3.3
"5V"  = 5.0
GND   = 0.0
IOREF = 3.3   # CN6 : référence des niveaux logiques (3,3 V)
AVDD  = 3.3   # CN5 : alimentation analogique (VDDA)

# --- Composants intégrés ------------------------------------------------------

# LED utilisateur verte, active à l'état haut.
[onboard.LD2]
type   = "led"
params = { color = "green" }
wires  = { A = "PA5", K = "GND" }

# Bouton utilisateur bleu : relie PC13 à la masse, pull-up externe sur la carte.
# Le composant « button » est créé en phase 1.
[onboard.B1]
type  = "button"
wires = { "1" = "PC13", "2" = "GND" }

# --- Bouton utilisateur ---------------------------------------------------------

[pins.PC13]
label         = "B1"
caps          = ["gpio", "exti"]
onboard       = "button:B1"
external_pull = "up"

# --- USART2 : relié par défaut au port COM virtuel du ST-LINK (VCP) -------------

[pins.PA2]
label = "VCP_TX"
caps  = ["gpio", "exti", "uart2:TX"]
af    = { "uart2:TX" = 7 }

[pins.PA3]
label = "VCP_RX"
caps  = ["gpio", "exti", "uart2:RX"]
af    = { "uart2:RX" = 7 }

# --- I2C1 ------------------------------------------------------------------------

[pins.PB8]
label = "D15"
caps  = ["gpio", "exti", "i2c1:SCL"]
af    = { "i2c1:SCL" = 4 }

[pins.PB9]
label = "D14"
caps  = ["gpio", "exti", "i2c1:SDA"]
af    = { "i2c1:SDA" = 4 }

# --- SPI1 (CS logiciel sur D10) ----------------------------------------------------

[pins.PA5]
label   = "D13"
caps    = ["gpio", "exti", "pwm:TIM2_CH1", "spi1:SCK"]
af      = { "pwm:TIM2_CH1" = 1, "spi1:SCK" = 5 }
onboard = "led:LD2"

[pins.PA6]
label = "D12"
caps  = ["gpio", "exti", "spi1:MISO"]
af    = { "spi1:MISO" = 5 }

[pins.PA7]
label = "D11"
caps  = ["gpio", "exti", "spi1:MOSI"]
af    = { "spi1:MOSI" = 5 }

[pins.PB6]
label = "D10"
caps  = ["gpio", "exti"]

# --- Entrées ADC (ADC1) ----------------------------------------------------------

[pins.PA0]
label = "A0"
caps  = ["gpio", "exti", "adc1:CH0"]

[pins.PA1]
label = "A1"
caps  = ["gpio", "exti", "adc1:CH1"]

[pins.PA4]
label = "A2"
caps  = ["gpio", "exti", "adc1:CH4"]

[pins.PB0]
label = "A3"
caps  = ["gpio", "exti", "adc1:CH8"]

[pins.PC1]
label = "A4"
caps  = ["gpio", "exti", "adc1:CH11"]

[pins.PC0]
label = "A5"
caps  = ["gpio", "exti", "adc1:CH10"]

# --- Sorties PWM -------------------------------------------------------------------

[pins.PA8]
label = "D7"
caps  = ["gpio", "exti", "pwm:TIM1_CH1"]
af    = { "pwm:TIM1_CH1" = 1 }

[pins.PB10]
label = "D6"
caps  = ["gpio", "exti", "pwm:TIM2_CH3"]
af    = { "pwm:TIM2_CH3" = 1 }

[pins.PB4]
label = "D5"
caps  = ["gpio", "exti", "pwm:TIM3_CH1"]
af    = { "pwm:TIM3_CH1" = 2 }

[pins.PC7]
label = "D9"
caps  = ["gpio", "exti", "pwm:TIM3_CH2"]
af    = { "pwm:TIM3_CH2" = 2 }

# --- Autres GPIO du connecteur Arduino ---------------------------------------------

[pins.PA10]
label = "D2"
caps  = ["gpio", "exti"]

[pins.PB3]
label = "D3"
caps  = ["gpio", "exti"]

[pins.PB5]
label = "D4"
caps  = ["gpio", "exti"]

[pins.PA9]
label = "D8"
caps  = ["gpio", "exti"]

# --- Disposition sur la paillasse (maquette de l'écran principal) -------------
# Connecteurs Arduino (UM1724, section 6.11) ; Morpho CN7/CN10 : plus tard.
# Pastilles numérotées comme sur la carte : « board.CN5:6 » = D13 (PA5).
# D0/D1 (CN9:1-2) ne sont pas reliés à PA3/PA2 avec les ponts de soudure
# d'usine (SB62/SB63 ouverts) : PA2/PA3 vont au port série du ST-LINK.

[layout]
size        = [280, 418]
holes       = [[16, 16], [264, 16], [16, 402], [250, 402]]
chip        = { pos = [100, 186], size = [80, 80] }
onboard     = { LD2 = [196, 84], B1 = [48, 92] }
unconnected = ["NC", "RESET", "VIN", "D0", "D1"]

[[layout.headers]]
id         = "CN6"
pos        = [10, 126]
dir        = "down"
label_side = "right"
pins       = ["NC", "IOREF", "RESET", "3V3", "5V", "GND", "GND", "VIN"]

[[layout.headers]]
id         = "CN8"
pos        = [10, 266]
dir        = "down"
label_side = "right"
pins       = ["PA0", "PA1", "PA4", "PB0", "PC1", "PC0"]

[[layout.headers]]
id         = "CN5"
pos        = [270, 240]
dir        = "up"
label_side = "left"
pins       = ["PA9", "PC7", "PB6", "PA7", "PA6", "PA5", "GND", "AVDD", "PB9", "PB8"]

[[layout.headers]]
id         = "CN9"
pos        = [270, 382]
dir        = "up"
label_side = "left"
pins       = ["D0", "D1", "PA10", "PB3", "PB5", "PB4", "PB10", "PA8"]
