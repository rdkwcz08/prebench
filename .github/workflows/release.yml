# .github/workflows/release.yml — Build et publication d'une version (dépôt public prebench).
# Section 12.5. Déclenché par le tag vX.Y.Z que pousse release.sh.
#
# Produit :
#   Prebench_X.Y.Z_aarch64.dmg          macOS Apple Silicon
#   Prebench_X.Y.Z_aarch64.app.tar.gz   archive de mise à jour macOS (+ signature)
#   Prebench_X.Y.Z_x64.msi              Windows x64 (installeur et mise à jour, + signature)
#   latest.json                         manifeste lu par le plugin updater de Tauri
#
# Avant toute publication, l'app est vérifiée telle qu'un utilisateur l'installe
# (job build, étapes « Vérification de l'app installée ») : .msi installé en
# silencieux dans C:\Program Files\Prebench, Prebench.app copiée depuis le .dmg.
# L'app, lancée avec --verifier-installation (app/src-tauri/src/install_check.rs),
# crée un projet depuis le modèle blinky, le compile avec le sdk installé, en
# trouvant seule CMake et le compilateur hors du PATH, puis attend que LD2
# clignote. Un échec bloque la release.
#
# Secrets du dépôt public (Settings → Secrets and variables → Actions) :
#   TAURI_SIGNING_PRIVATE_KEY           clé privée créée par `npx tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  son mot de passe
# La clé publique va dans app/src-tauri/tauri.conf.json (plugins.updater.pubkey),
# avec l'adresse https://github.com/rdkwcz08/prebench/releases/latest/download/latest.json
# et bundle.createUpdaterArtifacts = true.
#
# Côté Rust, l'app Windows est compilée avec la cible MSVC
# (x86_64-pc-windows-msvc), standard pour Tauri. L'interdiction de MSVC
# (section 12.3) concerne la compilation du firmware de l'utilisateur, pas l'app.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: darwin-aarch64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version du tag = version de l'app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME mais tauri.conf.json indique $APP_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Icône macOS 26 : icons/source/prebench.icon (Icon Composer) est compilé ici en
      # Assets.car avec actool de Xcode 26 ou plus, ses variantes sont vérifiées, puis il
      # est donné à Tauri (--config), qui le copie dans l'app et pose CFBundleIconName ;
      # le .icns reste le repli des macOS antérieurs. La compilation par Tauri lui-même
      # (bundle.icon .icon) plante dans actool sur le runner (exception interne,
      # release v0.2.1 du 14 novembre 2026) alors que la même commande, lancée seule,
      # réussit : on la lance donc nous-mêmes. On sélectionne explicitement le Xcode 26
      # ou plus le plus récent du runner, et on échoue clairement s'il n'y en a pas.
      - name: "macOS : Xcode 26 ou plus (actool, icône Liquid Glass)"
        if: runner.os == 'macOS'
        run: |
          actool_major() {
            xcrun actool --version --output-format=human-readable-text 2>/dev/null \
              | sed -n 's/.*short-bundle-version: *\([0-9][0-9]*\).*/\1/p'
          }
          # « version chemin » de chaque Xcode non bêta de 26 ou plus. Fonction plutôt
          # que boucle dans $( ) : le bash 3.2 de macOS lit mal un « case » dans une
          # substitution de commande. Statut toujours nul (pipefail).
          xcodes() {
            for candidate in /Applications/Xcode*.app; do
              [ -d "$candidate" ] || continue
              case "$candidate" in *[Bb]eta*) continue ;; esac
              v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$candidate/Contents/version.plist" 2>/dev/null || true)"
              if [ "${v%%.*}" -ge 26 ] 2>/dev/null; then echo "$v $candidate"; fi
            done
            return 0
          }
          xcodes | sed 's/^/Candidat : /'
          XCODE="$(xcodes | sort -V | tail -n 1 | cut -d' ' -f2-)"
          if [ -z "$XCODE" ]; then
            echo "::error::Aucun Xcode 26 ou plus sur le runner $(sw_vers -productVersion) : l'icône Liquid Glass (Assets.car) ne peut pas être compilée. Xcode présents : $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          MAJOR="$(actool_major)"
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "::error::$XCODE sélectionné, mais actool indique la version ${MAJOR:-introuvable} (26 ou plus attendu)"
            exit 1
          fi
          echo "Xcode : $XCODE ; actool $MAJOR"
          # Compilation dans un dossier neuf, chemins absolus, service ibtoold relancé.
          WORK="$RUNNER_TEMP/icone"
          rm -rf "$WORK" && mkdir -p "$WORK/out"
          cp -R app/src-tauri/icons/source/prebench.icon "$WORK/Icon.icon"
          pkill -9 ibtoold 2>/dev/null || true
          xcrun actool "$WORK/Icon.icon" --compile "$WORK/out" --output-format human-readable-text \
            --notices --warnings --output-partial-info-plist "$WORK/out/assetcatalog_generated_info.plist" \
            --app-icon Icon --include-all-app-icons --enable-on-demand-resources NO \
            --development-region en --target-device mac --minimum-deployment-target 10.13 \
            --platform macosx
          app/src-tauri/icons/verifier-assets-car.sh "$WORK/out/Assets.car" Icon
          cp "$WORK/out/Assets.car" app/src-tauri/icons/Assets.car
          # Liste d'icônes de tauri.conf.json, plus l'Assets.car compilé (Tauri le copie tel quel).
          node -e '
            const c = require("./app/src-tauri/tauri.conf.json");
            const icon = [...c.bundle.icon.filter((p) => !p.endsWith(".icon")), "icons/Assets.car"];
            require("fs").writeFileSync(process.argv[1], JSON.stringify({ bundle: { icon } }));
          ' "$RUNNER_TEMP/icone.json"
          cat "$RUNNER_TEMP/icone.json"
          echo "TAURI_ICON_CONFIG=$RUNNER_TEMP/icone.json" >> "$GITHUB_ENV"

      - name: Dépendances de l'interface
        working-directory: app
        run: npm ci

      - name: Build Tauri
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${TAURI_ICON_CONFIG:+--config "$TAURI_ICON_CONFIG"}

      - name: Renommage selon la section 12.5
        run: |
          BUNDLE="app/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          one() { # un seul fichier attendu par motif
            local found
            found="$(find "$BUNDLE" -type f -name "$1")"
            [ "$(printf '%s\n' "$found" | grep -c .)" = "1" ] || { echo "Attendu un seul $1 : $found" >&2; exit 1; }
            printf '%s' "$found"
          }
          if [ "${{ matrix.platform }}" = "darwin-aarch64" ]; then
            cp "$(one '*.dmg')"            "out/Prebench_${VERSION}_aarch64.dmg"
            cp "$(one '*.app.tar.gz')"     "out/Prebench_${VERSION}_aarch64.app.tar.gz"
            cp "$(one '*.app.tar.gz.sig')" "out/Prebench_${VERSION}_aarch64.app.tar.gz.sig"
          else
            cp "$(one '*.msi')"            "out/Prebench_${VERSION}_x64.msi"
            cp "$(one '*.msi.sig')"        "out/Prebench_${VERSION}_x64.msi.sig"
          fi
          ls -l out

      # --- Vérification de l'app installée (Windows) ---------------------------
      # Comme chez l'utilisateur : gcc et mingw32-make dans C:\msys64\ucrt64\bin
      # (MSYS2 préinstallé du runner), CMake dans C:\Program Files\CMake\bin.
      - name: "Windows : MinGW-w64 dans C:\\msys64"
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make

      - name: "Vérification de l'app installée (Windows : .msi)"
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:ProgramFiles\CMake\bin\cmake.exe")) { throw "CMake absent de $env:ProgramFiles\CMake\bin" }
          if (-not (Test-Path 'C:\msys64\ucrt64\bin\gcc.exe')) { throw 'gcc absent de C:\msys64\ucrt64\bin' }

          # Installation silencieuse, comme un double-clic sur le .msi.
          $msi = (Resolve-Path "out\Prebench_${env:VERSION}_x64.msi").Path
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 40; throw "msiexec : code $($p.ExitCode)" }
          $dir = Join-Path $env:ProgramFiles 'Prebench'
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object Name -notmatch 'uninstall' | Select-Object -First 1
          if (-not $exe -or -not (Test-Path "$dir\sdk\libvmcu")) { Get-ChildItem $dir -Recurse -Depth 1; throw "installation incomplète dans $dir" }
          $before = Get-ChildItem $dir -Recurse -Force | ForEach-Object FullName | Sort-Object

          # PATH sans CMake ni MinGW : l'app doit les trouver aux emplacements standard.
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and $_ -notmatch '(?i)cmake|msys64|mingw|strawberry' }) -join ';'
          if (Get-Command cmake, gcc -ErrorAction SilentlyContinue) { throw 'CMake ou gcc encore dans le PATH' }

          $project = Join-Path $env:RUNNER_TEMP 'Mes projets\blinky test'
          $report = Join-Path $env:RUNNER_TEMP 'verification.txt'
          $p = Start-Process $exe.FullName -ArgumentList '--verifier-installation', "`"$project`"", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Output 'rapport absent' }
          if ($p.ExitCode -ne 0) { throw "vérification : code $($p.ExitCode)" }

          # Rien n'est écrit dans le dossier d'installation.
          $after = Get-ChildItem $dir -Recurse -Force | ForEach-Object FullName | Sort-Object
          $diff = Compare-Object $before $after
          if ($diff) { $diff | Format-Table -AutoSize | Out-String -Width 200; throw "fichiers modifiés dans $dir" }

      # --- Vérification de l'app installée (macOS) -----------------------------
      # Prebench.app copiée depuis le .dmg dans /Applications et mise en lecture
      # seule ; lancée avec le PATH minimal d'une app ouverte depuis le Finder.
      - name: "Vérification de l'app installée (macOS : .dmg)"
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "out/Prebench_${VERSION}_aarch64.dmg"
          rm -rf /Applications/Prebench.app
          cp -R "$MNT/Prebench.app" /Applications/
          hdiutil detach "$MNT"
          APP=/Applications/Prebench.app
          test -d "$APP/Contents/Resources/sdk/libvmcu" || { echo "sdk absent de $APP" >&2; exit 1; }
          # Icône (app/src-tauri/icons/README.md) : Assets.car compilé avant le build depuis
          # icons/source/prebench.icon, avec ses variantes claire, sombre et teintée
          # (macOS 26 et plus), désigné par CFBundleIconName ; .icns en repli
          # (CFBundleIconFile) pour les macOS antérieurs.
          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist")" \
            || { echo "CFBundleIconName absent : Assets.car n'a pas été compilé" >&2; exit 1; }
          app/src-tauri/icons/verifier-assets-car.sh "$APP/Contents/Resources/Assets.car" "$ICON_NAME"
          ICON_FILE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")"
          test -f "$APP/Contents/Resources/$ICON_FILE" || { echo "$ICON_FILE absent de $APP" >&2; exit 1; }
          EXE="$(find "$APP/Contents/MacOS" -type f -perm -u+x | head -n 1)"
          chmod -R a-w "$APP"

          REPORT="$RUNNER_TEMP/verification.txt"
          STATUS=0
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$EXE" --verifier-installation "$RUNNER_TEMP/Mes projets/blinky test" "$REPORT" || STATUS=$?
          cat "$REPORT" 2>/dev/null || echo "rapport absent (voir stderr ci-dessus)"
          exit "$STATUS"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Notes de version (section du CHANGELOG)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "Section ## [$VERSION] absente du CHANGELOG" >&2; exit 1; }

      - name: Manifeste de mise à jour latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$(cat notes.md)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$(cat "dist/Prebench_${VERSION}_aarch64.app.tar.gz.sig")" \
            --arg mac_url "$BASE/Prebench_${VERSION}_aarch64.app.tar.gz" \
            --arg win_sig "$(cat "dist/Prebench_${VERSION}_x64.msi.sig")" \
            --arg win_url "$BASE/Prebench_${VERSION}_x64.msi" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > dist/latest.json
          cat dist/latest.json

      - name: Création de la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Prebench $VERSION" \
            --notes-file notes.md \
            "dist/Prebench_${VERSION}_aarch64.dmg" \
            "dist/Prebench_${VERSION}_aarch64.app.tar.gz" \
            "dist/Prebench_${VERSION}_x64.msi" \
            dist/latest.json
